<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emerging AI Concepts — Living Ontology</title>
<style>
  :root {
    --bg: #0c0f14; --panel: #131822; --ink: #e8ecf2; --muted: #8b95a5;
    --edge: #26303f; --accent: #6ea8fe;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    overflow: hidden; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: baseline; gap: 16px; padding: 14px 22px;
    background: linear-gradient(180deg, rgba(12,15,20,.94), rgba(12,15,20,.75) 70%, transparent);
    pointer-events: none; }
  header h1 { font-size: 17px; font-weight: 650; letter-spacing: .02em; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  header .count { margin-left: auto; color: var(--muted); font-size: 12.5px;
    font-variant-numeric: tabular-nums; }
  #legend { position: fixed; left: 18px; bottom: 18px; z-index: 10;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    padding: 12px 14px; font-size: 12px; max-width: 230px; }
  #legend .row { display: flex; align-items: center; gap: 8px; padding: 2.5px 0;
    cursor: pointer; user-select: none; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #legend .row.off { opacity: .35; }
  svg { display: block; }
  .link { stroke: #3a4657; stroke-opacity: .5; stroke-width: 1.1px; fill: none; }
  .node circle { stroke-width: 1.5; cursor: pointer;
    transition: r .18s ease; }
  .node circle.established { stroke-opacity: .9; }
  .node circle.emerging { stroke-dasharray: 3 2.5; }
  .node text { fill: #c6cedb; font-size: 10.5px; paint-order: stroke;
    stroke: #0c0f14; stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none; }
  .node:hover text { fill: #fff; }
  #card { position: fixed; right: 18px; top: 64px; width: 320px; z-index: 10;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    padding: 16px 18px; display: none; }
  #card h2 { font-size: 15px; margin-bottom: 2px; }
  #card .meta { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; }
  #card p { font-size: 13px; color: #cdd5e0; }
  #card a { color: var(--accent); text-decoration: none; font-size: 12px;
    display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #card .close { position: absolute; top: 8px; right: 12px; cursor: pointer;
    color: var(--muted); }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px;
    color: var(--muted); font-size: 12px; z-index: 9; }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
<header>
  <h1>Emerging AI Concepts</h1>
  <span class="sub">living ontology · 2024 → now · weekly growth</span>
  <span class="count" id="count"></span>
</header>
<div id="legend"></div>
<div id="card"><span class="close" onclick="card.style.display='none'">✕</span>
  <h2 id="c-title"></h2><div class="meta" id="c-meta"></div>
  <p id="c-sum"></p><div id="c-src"></div></div>
<div id="hint">drag to pan · scroll to zoom · click a node</div>
<script>
window.onerror = function (m) {
  var h = document.getElementById("hint");
  if (h) h.textContent = "error: " + m;
};
</script>
<script>
document.getElementById("hint").textContent = "booting graph…";
const COLORS = {
  reasoning:"#e05f5f", agents:"#e0a95f", architecture:"#5fb8e0",
  training:"#b45fe0", retrieval:"#5fe0a0", multimodal:"#e05fb4",
  infrastructure:"#8f9fe0", "interaction-protocols":"#c9e05f",
  evaluation:"#5fd9e0", safety:"#e08f5f"
};
fetch("ontology.json").then(r => r.json()).then(o => {
  const concepts = o.concepts, rels = o.relations;
  document.getElementById("count").textContent =
    concepts.length + " concepts · " + rels.length + " relations · updated " + o.meta.updated;
  const W = innerWidth, H = innerHeight;
  const svg = d3.select("body").append("svg").attr("width", W).attr("height", H);
  const g = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.15, 8]).on("zoom", e => g.attr("transform", e.transform)));

  const nodes = concepts.map(c => ({...c}));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const links = rels.filter(r => byId.has(r.from) && byId.has(r.to))
    .map(r => ({source: r.from, target: r.to, type: r.type}));

  const link = g.append("g").selectAll("line").data(links).join("line")
    .attr("class", "link");
  const node = g.append("g").selectAll("g").data(nodes).join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append("circle")
    .attr("r", d => 7 + Math.sqrt(links.filter(l => l.source === d.id || l.target === d.id).length) * 2.1)
    .attr("fill", d => COLORS[d.category] || "#888")
    .attr("stroke", "rgba(0,0,0,.45)")
    .attr("class", d => d.status || "emerging");
  node.append("text").attr("dx", 12).attr("dy", 3.5).text(d => d.label);

  const card = document.getElementById("card");
  node.on("click", (e, d) => {
    document.getElementById("c-title").textContent = d.label;
    document.getElementById("c-meta").textContent =
      d.category + " · first seen " + d.first_seen + " · " + (d.status || "emerging") +
      (d.aliases && d.aliases.length ? " · aka " + d.aliases.join(", ") : "");
    document.getElementById("c-sum").textContent = d.summary || "";
    const src = document.getElementById("c-src");
    src.innerHTML = "";
    (d.sources || []).forEach(s => {
      const a = document.createElement("a");
      a.href = s.url; a.textContent = s.title || s.url; a.target = "_blank";
      src.appendChild(a);
    });
    card.style.display = "block";
    e.stopPropagation();
  });

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(95).strength(.35))
    .force("charge", d3.forceManyBody().strength(-340))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collide", d3.forceCollide(26))
    .on("tick", () => {
      link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

  document.getElementById("hint").textContent =
    "drag to pan · scroll to zoom · click a node";
  const legend = document.getElementById("legend");
  Object.entries(COLORS).forEach(([cat, col]) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="dot" style="background:${col}"></span>${cat}`;
    row.onclick = () => {
      row.classList.toggle("off");
      const off = row.classList.contains("off");
      node.filter(d => d.category === cat).style("display", off ? "none" : "");
      link.attr("display", d => {
        const s = d.source.id || d.source, t = d.target.id || d.target;
        const vis = n => byId.get(n) && byId.get(n).category !== cat || !off ? true : false;
        return (vis(s) && vis(t)) ? null : "none";
      }).style("opacity", d => {
        const s = d.source.id || d.source, t = d.target.id || d.target;
        return (byId.get(s)?.category === cat || byId.get(t)?.category === cat) && off ? 0.08 : .5;
      });
    };
    legend.appendChild(row);
  });
});
</script>
</body>
</html>
